name: Deploy GitHub Pages

# main과 작업 브랜치 양쪽에서 배포한다.
# (자료가 아직 main에 병합되지 않아, 병합 전에도 사이트가 뜨도록)
on:
  push:
    branches:
      - main
      - claude/english-mock-exam-prep-7t9mvq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true — 저장소에 Pages가 꺼져 있으면 켜고 소스를 Actions로 설정한다
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/
          # Jekyll 처리를 끈다 — 한글 폴더명과 밑줄 시작 파일이 누락되지 않도록
          touch _site/.nojekyll
          echo "--- staged ---"
          ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
